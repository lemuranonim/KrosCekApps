name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write  # ← tambahkan ini

env:
  # Keep dependency resolution and Shorebird builds on the tested Flutter SDK.
  FLUTTER_VERSION: '3.47.4'

jobs:
  build-and-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          set -euo pipefail
          TAG=${GITHUB_REF#refs/tags/v}
          [[ "$TAG" =~ ^[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}$ ]] || exit 1
          python3 - "$TAG" <<'PY'
          from pathlib import Path
          import sys
          version = next(line.split(':', 1)[1].strip().split('+', 1)[0]
                         for line in Path('pubspec.yaml').read_text().splitlines() if line.startswith('version:'))
          if version != sys.argv[1]:
              raise SystemExit('Tag must match pubspec release version')
          PY
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - name: Require protected release credentials
        env:
          RELEASE_KEY: ${{ secrets.SUPABASE_RELEASE_KEY }}
        run: |
          test -n "$RELEASE_KEY" || { echo 'Configure SUPABASE_RELEASE_KEY before releasing.'; exit 1; }

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Create .env file
        env:
          CLIENT_URL: ${{ secrets.SUPABASE_URL }}
          CLIENT_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$CLIENT_URL" "$CLIENT_KEY" > .env

      - name: Setup keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/my-release-key.jks
          printf 'keyAlias=%s\nkeyPassword=%s\nstoreFile=my-release-key.jks\nstorePassword=%s\n' "$KEY_ALIAS" "$KEY_PASSWORD" "$STORE_PASSWORD" > android/key.properties
          python3 scripts/security/check_signing_key.py --keystore android/app/my-release-key.jks --alias "$KEY_ALIAS" --password-env STORE_PASSWORD
          
      - name: Setup Google Services
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      - name: Install dependencies
        run: |
          flutter config --enable-native-assets
          flutter pub get

      - name: Test update source validation
        run: flutter test test/full_update_service_test.dart

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Build APK release via Shorebird
        run: shorebird release android --artifact apk --flutter-version="$FLUTTER_VERSION"
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

      - name: Apply and verify signing-key rotation
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          python3 scripts/security/sign_rotated_apk.py \
            --apk build/app/outputs/apk/release/app-release.apk \
            --keystore android/app/my-release-key.jks \
            --alias "$KEY_ALIAS" --password-env STORE_PASSWORD

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/apk/release/app-release.apk
          name: "KROSCEK v${{ steps.version.outputs.version }}"
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-update-configuration:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Publish approved release configuration
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          CLIENT_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RELEASE_KEY: ${{ secrets.SUPABASE_RELEASE_KEY }}
        run: |
          set -euo pipefail
          VERSION=${RELEASE_TAG#v}
          [[ "$VERSION" =~ ^[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}$ ]] || exit 1
          test -n "$RELEASE_KEY"
          curl --fail-with-body --silent --show-error -X POST "${SUPABASE_URL}/functions/v1/release-config" \
            -H "apikey: ${CLIENT_KEY}" \
            -H "Authorization: Bearer ${CLIENT_KEY}" \
            -H "X-Release-Token: ${RELEASE_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"version\":\"${VERSION}\"}"
