name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # ← tambahkan ini

env:
  # Keep dependency resolution and Shorebird builds on the tested Flutter SDK.
  FLUTTER_VERSION: '3.47.4'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          set -euo pipefail
          TAG=${GITHUB_REF#refs/tags/v}
          [[ "$TAG" =~ ^[0-9][0-9A-Za-z._+-]*$ ]] || exit 1
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - name: Require protected release credentials
        env:
          RELEASE_KEY: ${{ secrets.SUPABASE_RELEASE_KEY }}
        run: |
          test -n "$RELEASE_KEY" || { echo 'Configure SUPABASE_RELEASE_KEY before releasing.'; exit 1; }

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Create .env file
        env:
          CLIENT_URL: ${{ secrets.SUPABASE_URL }}
          CLIENT_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$CLIENT_URL" "$CLIENT_KEY" > .env

      - name: Setup keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/my-release-key.jks
          printf 'keyAlias=%s\nkeyPassword=%s\nstoreFile=my-release-key.jks\nstorePassword=%s\n' "$KEY_ALIAS" "$KEY_PASSWORD" "$STORE_PASSWORD" > android/key.properties
          python3 scripts/security/check_signing_key.py --keystore android/app/my-release-key.jks --alias "$KEY_ALIAS" --password-env STORE_PASSWORD
          
      - name: Setup Google Services
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Build APK release via Shorebird
        run: shorebird release android --artifact apk --flutter-version="$FLUTTER_VERSION"
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/apk/release/app-release.apk
          name: "KROSCEK v${{ steps.version.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version in Supabase
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          RELEASE_KEY: ${{ secrets.SUPABASE_RELEASE_KEY }}
        run: |
          set -euo pipefail
          APK_URL="https://github.com/lemuranonim/KrosCekApps/releases/download/v${VERSION}/app-release.apk"

          curl --fail-with-body --silent --show-error -X PATCH "${SUPABASE_URL}/rest/v1/app_config?id=eq.kroscek" \
            -H "apikey: ${RELEASE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{
              \"latest_version\": \"${VERSION}\",
              \"min_version\": \"${VERSION}\",
              \"apk_url\": \"${APK_URL}\",
              \"force_update\": true
            }"
