name: Verify and publish security recovery
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [verify, publish]
        default: verify
      release_tag:
        type: string
        default: v4.9.10
        required: true
      build_run_id:
        type: string
        default: '40181628294'
        required: true
      verification_run_id:
        type: string
        default: '0'
permissions:
  contents: read
  actions: read
jobs:
  verify-signing-upgrade:
    if: inputs.operation == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 28
            arch: x86
          - api: 31
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check artifact source is the approved release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: python3 scripts/security/cloud_release_recovery.py verify-build
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools emulator'
          log-accepted-android-sdk-licenses: 'false'
      - uses: actions/download-artifact@v4
        with:
          name: signed-security-apk
          path: security-test
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Download previously distributed APK
        run: |
          curl --fail --location --silent --show-error \
            'https://github.com/lemuranonim/KrosCekApps/releases/download/v4.9.8/app-release.apk' \
            --output security-test/legacy-app.apk
      - name: Start isolated emulator with explicit registry
        env:
          API: ${{ matrix.api }}
          ARCH: ${{ matrix.arch }}
        run: bash scripts/security/start_emulator.sh
      - name: Verify upgrade and old-key rejection
        env:
          API: ${{ matrix.api }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          python3 scripts/security/verify_signing_emulator.py \
            --old-apk security-test/legacy-app.apk --new-apk security-test/app-release.apk \
            --output "security-test/signing-api${API}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signing-verification-api${{ matrix.api }}
          path: |
            security-test/signing-api*.json
            security-test/emulator.log
          retention-days: 30
      - name: Stop emulator
        if: always()
        run: adb -s emulator-5554 emu kill || true
  publish-verified-release:
    if: inputs.operation == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Publish only the exact APK verified by both devices
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          VERIFICATION_RUN_ID: ${{ inputs.verification_run_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_RELEASE_KEY: ${{ secrets.SUPABASE_RELEASE_KEY }}
        run: python3 scripts/security/cloud_release_recovery.py publish
