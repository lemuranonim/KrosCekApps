import com.android.build.api.instrumentation.InstrumentationScope
import com.kroscek.build.ReceiverPermissionVisitor

plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.gms.google-services'
    id 'dev.flutter.flutter-gradle-plugin' // Tambahkan ini
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode", "1").toInteger()
def flutterVersionName = localProperties.getProperty("flutter.versionName", "Release")
def mapsApiKey = localProperties.getProperty("MAPS_API_KEY") ?: System.getenv("MAPS_API_KEY") ?: ""

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
} else {
    throw new GradleException("Keystore properties file not found: " + keystorePropertiesFile.getAbsolutePath())
}

android {
    namespace 'com.example.kroscek'

    compileSdkVersion 36
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.example.kroscek"
        // APK signing-key rotation is supported from Android 9 (API 28).
        minSdkVersion 28
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        // Preserve placeholders injected by Flutter (for example
        // applicationName) and add only the Maps key owned by this app.
        manifestPlaceholders["MAPS_API_KEY"] = mapsApiKey

        multiDexEnabled true
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }
    lint {
        baseline = file("lint-baseline.xml")
    }
}

flutter {
    source = "../.."
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.instrumentation.transformClassesWith(ReceiverPermissionVisitor,
                InstrumentationScope.ALL) { }
    }
}

// Both local and CI APK releases must carry the approved certificate lineage.
// Passwords are passed to the signer through the process environment only.
def rotatedReleaseSigning = tasks.register('signRotatedRelease', Exec) {
    def releaseApk = layout.buildDirectory.file('outputs/apk/release/app-release.apk')
    def python = System.getenv('KROSCEK_PYTHON') ?:
            (System.getProperty('os.name').toLowerCase().contains('windows') ? 'python' : 'python3')
    commandLine python, rootProject.file('../scripts/security/sign_rotated_apk.py'),
            '--apk', releaseApk.get().asFile,
            '--keystore', android.signingConfigs.release.storeFile,
            '--alias', keystoreProperties['keyAlias'],
            '--password-env', 'KROSCEK_RELEASE_STORE_PASSWORD'
    environment 'KROSCEK_RELEASE_STORE_PASSWORD', keystoreProperties['storePassword']
    environment 'JAVA_HOME', System.getProperty('java.home')
    environment 'PATH', new File(System.getProperty('java.home'), 'bin').absolutePath +
            File.pathSeparator + System.getenv('PATH')
    environment 'ANDROID_SDK_ROOT', localProperties.getProperty('sdk.dir') ?:
            System.getenv('ANDROID_SDK_ROOT') ?: System.getenv('ANDROID_HOME')
    doLast {
        copy {
            from releaseApk
            into layout.buildDirectory.dir('outputs/flutter-apk')
        }
    }
}
tasks.configureEach { task ->
    if (task.name == 'assembleRelease') task.finalizedBy(rotatedReleaseSigning)
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'com.android.support:multidex:2.0.1'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    implementation platform('com.google.firebase:firebase-bom:33.15.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'

    implementation 'com.google.android.gms:play-services-location:17.0.0'
    implementation 'com.google.android.gms:play-services-basement:18.4.0'
    implementation 'com.google.android.gms:play-services-maps:18.0.2'
    implementation 'androidx.credentials:credentials:1.2.0-alpha04'
    implementation 'com.google.android.gms:play-services-auth:21.3.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
